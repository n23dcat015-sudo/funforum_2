server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: mọi route không khớp file tĩnh đều trả về index.html cho React Router xử lý.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API sang service "backend" trong cùng docker-compose network,
    # để frontend và API cùng origin (cookie refresh token) ở production.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
